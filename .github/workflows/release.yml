name: Release

# FyneApp.toml's Version is the single source of truth for what is released:
# when main carries a version that has no tag yet, tag it and publish.
# Entry point is release-prepare.yml, which opens the version bump PR.
on:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
    - uses: actions/checkout@v7

    - id: check
      run: |
        version="$(sed -nE 's/^[[:space:]]*Version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' FyneApp.toml | head -n1)"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid Version '$version' in FyneApp.toml (expected X.Y.Z or X.Y.Z-suffix)"
          exit 1
        fi
        tag="v$version"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

        # a version with a suffix is a pre-release
        if [[ "$version" == *-* ]]; then
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
        else
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
        fi

        # an existing tag means this version already shipped, so re-runs are safe
        if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "::notice::$tag already released, nothing to do"
        else
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Releasing $tag"
        fi

  # windows / linux: cross-compile in docker via fyne-cross
  build-cross:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'

    - name: Build and package
      run: |
        go install github.com/fyne-io/fyne-cross@latest
        fyne-cross ${{ matrix.target }}

    - name: Collect artifacts
      run: |
        mkdir -p release
        find fyne-cross/dist -type f -exec cp {} release/ \;
        ls -l release

    - uses: actions/upload-artifact@v7
      with:
        name: release-${{ matrix.target }}
        path: release/*
        if-no-files-found: error

  # darwin: build natively, fyne-cross has no free darwin image
  build-darwin:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the last x86_64 macOS image, retiring Aug 2027
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-go@v7
      with:
        go-version: '1.26.2'

    - name: Build and package
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        fyne package --os darwin

    - name: Collect artifacts
      run: |
        mkdir -p release
        ditto -c -k --keepParent "Image Packer.app" "release/goimgpack-darwin-${{ matrix.arch }}.zip"
        ls -l release

    - uses: actions/upload-artifact@v7
      with:
        name: release-darwin-${{ matrix.arch }}
        path: release/*
        if-no-files-found: error

  release:
    needs: [check, build-cross, build-darwin]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v7
      with:
        pattern: release-*
        merge-multiple: true
        path: release

    - run: ls -l release

    # the action creates the tag on this commit
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ needs.check.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
