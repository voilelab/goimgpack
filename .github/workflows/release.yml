name: Release

on:
  # 從 Actions UI 選 branch、填 tag 即可發版，不用 local push tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.5.0 (created on the selected branch)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        type: boolean
        default: false
  # 直接 push tag 也照樣發版
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}

    steps:
    # 先擋掉格式錯的 tag，免得跑完三個平台才失敗
    - id: resolve
      env:
        INPUT_TAG: ${{ inputs.tag }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        tag="${INPUT_TAG:-$REF_NAME}"
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid tag '$tag' (expected vX.Y.Z or vX.Y.Z-suffix)"
          exit 1
        fi
        echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # windows / linux: cross-compile in docker via fyne-cross
  build-cross:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [windows, linux]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Build and package
      run: |
        go install github.com/fyne-io/fyne-cross@latest
        fyne-cross ${{ matrix.target }}

    - name: Collect artifacts
      run: |
        mkdir -p release
        find fyne-cross/dist -type f -exec cp {} release/ \;
        ls -l release

    - uses: actions/upload-artifact@v4
      with:
        name: release-${{ matrix.target }}
        path: release/*
        if-no-files-found: error

  # darwin: build natively, fyne-cross has no free darwin image
  build-darwin:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the last x86_64 macOS image, retiring Aug 2027
          - runner: macos-15-intel
            arch: amd64
          - runner: macos-latest
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Build and package
      run: |
        go install fyne.io/tools/cmd/fyne@latest
        fyne package --os darwin

    - name: Collect artifacts
      run: |
        mkdir -p release
        ditto -c -k --keepParent "Image Packer.app" "release/goimgpack-darwin-${{ matrix.arch }}.zip"
        ls -l release

    - uses: actions/upload-artifact@v4
      with:
        name: release-darwin-${{ matrix.arch }}
        path: release/*
        if-no-files-found: error

  release:
    needs: [prepare, build-cross, build-darwin]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        merge-multiple: true
        path: release

    - run: ls -l release

    # tag 不存在時由 action 在 target_commitish 上建立
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.prepare.outputs.tag }}
        target_commitish: ${{ github.sha }}
        files: release/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ inputs.prerelease || contains(needs.prepare.outputs.tag, '-') }}
